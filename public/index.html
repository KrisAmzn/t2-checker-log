
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>T2 Checker Log API</title>
</head>
<body>
<h2>T2 Checker Log - API Server</h2>
<p>API is running.</p>
<button id="testBtn">点击测试 API</button>
<h3>返回结果：</h3>
<pre id="result">等待测试...</pre>

<script>
document.getElementById('testBtn').addEventListener('click', function() {
  document.getElementById('result').textContent = '发送中...';

  var data = {
    user_alias: 'kris_test',
    action_type: 'test_connection',
    client_timestamp: new Date().toISOString(),
    details: {
      message: 'test database connection',
      booking_id: 'TEST-001',
      issue_type: 'missing_carp',
      result: 'eligible'
    }
  };

  fetch('/api/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(function(res) {
    var info = 'Status: ' + res.status + '\n';
    info += 'Content-Type: ' + res.headers.get('content-type') + '\n\n';
    return res.text().then(function(text) {
      return info + 'Body:\n' + text;
    });
  })
  .then(function(output) {
    document.getElementById('result').textContent = output;
  })
  .catch(function(err) {
    document.getElementById('result').textContent = 'Request failed: ' + err.message;
  });
});
</script>
</body>
</html>
